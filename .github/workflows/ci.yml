# 푸시·PR마다 검사한다. 릴리스(release.yml)도 이 워크플로를 불러 같은 검사를 거친다.
# 실제 Claude Code는 부르지 않는다(브라우저 시험은 가짜 Claude CLI, 구독 사용량 없음).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1" # 한글 로그·파일을 OS 기본 인코딩(Windows cp1252 등)과 상관없이 UTF-8로

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Test
        run: python -m pytest -q

  web:
    name: Web (typecheck · vitest · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/compose/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E (Playwright · Edge)
    needs: [backend, web]
    # 시험이 설치된 Edge(channel: msedge)를 쓰므로 Edge가 깔린 Windows 러너에서 돌린다
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend (playwright.config.ts가 backend/.venv를 쓴다)
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --require-hashes -r backend/requirements-dev.lock
          backend/.venv/Scripts/python.exe -m pip install --no-deps -e backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web
        working-directory: apps/web
        run: npm ci
      - name: Test
        working-directory: apps/web
        run: npx playwright test
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          if-no-files-found: ignore
