# 소개 페이지(site/)를 GitHub Pages(https://wnsdyd1128.github.io/Paperloom/)에 올린다.
# 저장소 Settings → Pages의 Source가 "GitHub Actions"여야 한다(한 번만 바꾼다).
# 로고·예시 그림(.github/assets)과 앱의 글꼴(apps/web)은 두 벌 두지 않고 여기서 복사한다.
# API 문서(site/api)의 명세는 앱에서 꺼내고, 화면은 서버의 /docs가 쓰는 Swagger UI 파일을 복사한다.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/assets/**"
      - "apps/web/src/shared/theme/fonts/**"
      # API 문서: 명세가 나오는 서버 코드, 명세를 꺼내는 스크립트, Swagger UI의 판
      - "backend/src/**"
      - "backend/requirements.lock"
      - "ops/site/**"
      - "apps/web/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend
        run: |
          python -m pip install --require-hashes --no-deps -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web
        working-directory: apps/web
        run: npm ci
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp .github/assets/logo.svg .github/assets/image.png _site/assets/
          cp apps/web/src/shared/theme/fonts/WantedSansVariable.woff2 apps/web/src/shared/theme/fonts/OFL.txt _site/assets/
          python ops/site/export_openapi.py _site/api/openapi.json
          cp apps/web/node_modules/swagger-ui-dist/swagger-ui-bundle.js apps/web/node_modules/swagger-ui-dist/swagger-ui.css _site/api/
          cp apps/web/node_modules/swagger-ui-dist/LICENSE _site/api/LICENSE.txt
          cp apps/web/node_modules/swagger-ui-dist/NOTICE _site/api/NOTICE.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
