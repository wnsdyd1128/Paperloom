name: 기능 제안
description: 있으면 좋겠는 기능이나 바뀌었으면 하는 동작을 알려 주세요
title: "[제안] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 불편이 있나요
      description: 논문을 읽으며 어떤 상황에서 막히는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 바라는 동작
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
  - type: markdown
    attributes:
      value: |
        Paperloom은 유료 모델 API 없이 이 PC의 Claude Code(구독)로만 AI 기능을 실행하고, 데이터를 내 PC 밖으로 보내지 않는 것을 원칙으로 합니다. 이 원칙과 부딪히는 제안은 받기 어려울 수 있습니다.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 같은 내용의 이슈가 이미 있는지 찾아봤습니다
          required: true
