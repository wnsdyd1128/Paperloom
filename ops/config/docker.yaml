# 컨테이너 안의 설정 (ops/compose/Dockerfile이 /app/config/paperloom.yaml로 복사).
# 컨테이너 안에서는 0.0.0.0에 바인딩하고, 호스트 공개 범위는 compose의 127.0.0.1 포트 매핑이 제한한다.
app:
  mode: local
  bind_host: 0.0.0.0
  port: 8000
  data_dir: /data
  web_dist_dir: /app/web
layout:
  model_path: /app/models/pp-doclayout-plus-l/inference.onnx  # 이미지에 넣은 모델(ops/compose/Dockerfile)
  device: auto  # GPU 이미지를 GPU와 함께 띄우면 CUDA, 아니면 CPU
ocr:
  model_path: /app/models/pp-ocrv6-small-rec/inference.onnx  # 이미지에 넣은 글줄 인식 모델과 글자 사전(inference.yml)
  device: auto
wiki:
  outbox_path: /data/outbox  # compose가 호스트 폴더를 붙인다. 없으면 Wiki로 내보내기만 막힌다
artifacts:
  shown_dir: var/artifacts  # 서버는 /data/artifacts에 쓰고, compose가 그 자리에 저장소의 var/artifacts를 붙인다
cost_policy:
  mode: plan_only
  paid_model_calls_allowed: false
  paid_fallback_allowed: false
  automatic_credit_purchase_allowed: false
