# Windows 압축본의 설정 (ops/bundle/build.py가 압축본의 config/paperloom.yaml로 넣는다).
# 상대 경로는 이 파일 위치(압축본의 config 폴더) 기준이고, ~는 사용자 폴더다. 웹·모델은 압축본 안에 두고(build.py가 이 자리에
# 넣는다), 데이터는 압축본 밖에 둔다: 새 판 압축본으로 폴더를 바꿔도 서재가 남는다.
app:
  mode: local
  bind_host: 127.0.0.1
  port: 8000
  data_dir: ~/.paperloom/data
  web_dist_dir: ../web
layout:
  model_path: ../models/pp-doclayout-plus-l/inference.onnx
  device: auto  # CPU용 onnxruntime이라 CPU로 돈다
ocr:
  model_path: ../models/pp-ocrv6-small-rec/inference.onnx  # 글자 사전(inference.yml)은 같은 폴더
  device: auto
cost_policy:
  mode: plan_only
  paid_model_calls_allowed: false
  paid_fallback_allowed: false
  automatic_credit_purchase_allowed: false
