# 로컬 실행: python -m paperloom --config ops/config/local.yaml
# 상대 경로는 이 파일 위치 기준이다 (data_dir → 저장소의 var/).
app:
  mode: local
  bind_host: 127.0.0.1
  port: 8000
  data_dir: ../../var
wiki:
  enabled: false  # 개발 중이라 꺼 둔다. true면 화면에 Wiki로 내보내기가 보이고 bundle을 쓴다
  outbox_path: ../../var/outbox  # 폴더를 만들어야 Wiki로 내보내기가 켜진다
cost_policy:
  mode: plan_only
  paid_model_calls_allowed: false
  paid_fallback_allowed: false
  automatic_credit_purchase_allowed: false
