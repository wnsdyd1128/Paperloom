# 실행: docker compose -f ops/compose/compose.yaml up -d --build
# NVIDIA GPU가 있으면 ops/start.ps1(Windows)·ops/start.sh가 compose.gpu.yaml을 덧붙여 GPU 이미지로 띄운다(없으면 이 파일만).
# IDE·터미널을 닫아도 유지되고, 재부팅 후 Docker가 시작되면 다시 올라온다 (PLAN A12).
name: paperloom

services:
  app:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile
    image: paperloom-app:0.8.0
    ports:
      - "127.0.0.1:8000:8000"  # 호스트에서는 loopback에만 공개
    volumes:
      # SQLite(W02)를 Windows bind mount 위에 두지 않도록 named volume을 쓴다 (IMPL §15).
      - paperloom-data:/data
      # Wiki로 내보낼 Evidence Bundle을 쓰는 폴더(저장소의 var/outbox). LLM Wiki는 같은 폴더를 읽기 전용으로 붙인다(compose.paperloom.yaml).
      # 리눅스에서는 이 폴더가 컨테이너 사용자(uid 10001)에게 쓰기 가능해야 한다.
      - ../../var/outbox:/data/outbox
      # 대화 답의 아티팩트를 링크로 열 페이지 파일(저장소의 var/artifacts). 파일 탐색기에서 바로 열거나 옮길 수 있게 호스트 폴더에 둔다.
      # 리눅스에서는 outbox처럼 컨테이너 사용자(uid 10001)가 쓸 수 있어야 한다.
      - ../../var/artifacts:/data/artifacts
    restart: unless-stopped

volumes:
  paperloom-data:
